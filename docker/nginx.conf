# Serves apps/web's built SPA in production (see Dockerfile's `runner-web` stage).
#
# `try_files ... /index.html` is the one thing a plain static file server doesn't do by default
# and a client-side-routed SPA (react-router) needs: a hard refresh/direct link on e.g.
# /projects/abc123 must still serve index.html (letting the client-side router take over), not a
# 404 for a path nginx has no actual file for.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames (Vite's default asset naming) never change content under the same name —
    # safe to cache aggressively. index.html itself is deliberately excluded (falls through to the
    # "/" block above with no special cache headers) since it's what references the current
    # hashed asset names and must always be revalidated.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
